services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bigdata_nifi
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/init:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d bigdata_nifi"]
      interval: 5s
      timeout: 5s
      retries: 25
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9095:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "nifi5dHSoSYq_9nTa_cfpQ"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - "--bootstrap-server"
      - "kafka:9092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "lab5_sales"
      - "--partitions"
      - "1"
      - "--replication-factor"
      - "1"
    restart: "no"

  nifi:
    build:
      context: ./nifi
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
      NIFI_SENSITIVE_PROPS_KEY: "BigDataNiFiLab5LocalKey2026"
    volumes:
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_conf:/opt/nifi/nifi-current/conf
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  nifi-setup:
    build:
      context: ./nifi-setup
      dockerfile: Dockerfile
    environment:
      NIFI_URL: "http://nifi:8080/nifi-api"
      POSTGRES_PASSWORD: "student123"
    depends_on:
      nifi:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "lab5_sales"
      DATA_DIR: "/data"
      SEND_DELAY_SECONDS: "0.001"
    volumes:
      - "./исходные данные:/data:ro"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      nifi-setup:
        condition: service_completed_successfully
    restart: "no"

  metabase:
    image: metabase/metabase:v0.65.6.3
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      MB_DB_FILE: "/metabase-data/metabase.db"
      JAVA_TIMEZONE: "Europe/Moscow"
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_conf:
  metabase_data:
